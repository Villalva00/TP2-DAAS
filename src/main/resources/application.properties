# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==============================================================================
spring.application.name=TP2

# ==============================================================================
# CONFIGURACIÓN DE LA CONEXIÓN A LA BASE DE DATOS (MYSQL)
# ==============================================================================
# URL de conexión JDBC apuntando al contenedor local y a la base de datos del sistema bancario.
spring.datasource.url=jdbc:mysql://localhost:3308/sistema_bancario?useSSL=false&serverTimezone=America/Argentina/Jujuy&allowPublicKeyRetrieval=true

# Credenciales de acceso inyectadas mediante variables de entorno del sistema.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC utilizado para la comunicación con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURACIÓN DE HIBERNATE Y JPA
# ==============================================================================
# Estrategia DDL: 'update' valida y actualiza de forma automática las tablas según las entidades mapeadas.
spring.jpa.hibernate.ddl-auto=update

# Habilita la visualización de las sentencias SQL reales ejecutadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Formatea el código SQL impreso en consola para mejorar su legibilidad.
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# CONFIGURACIÓN DE INICIALIZACIÓN DE DATOS (SCRIPT SQL)
# ==============================================================================
# Asegura que la ejecución del archivo data.sql ocurra siempre al iniciar la aplicación.
spring.sql.init.mode=always

# Aplica un retraso en la inicialización de los datos para garantizar que Hibernate
# haya creado las tablas correspondientes antes de ejecutar las sentencias INSERT.
spring.jpa.defer-datasource-initialization=true
spring.config.import=optional:file:.env[.properties]

# Límites globales de extracción diaria (TP5-A)
app.limites.extraccion-diaria.titular=100000.00
app.limites.extraccion-diaria.adherente=70000.00

#===================================================================
# --- Correo (TP5-B) ---
# Desarrollo: MailHog/Mailpit en localhost:1025, sin autenticación.
# Para Mailtrap u otro SMTP, definí las variables de entorno. Nunca credenciales en el repo.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@sistemabancario.local}
app.base-url=${APP_BASE_URL:http://localhost:8080}

#===================================================================
# --- Comisiones de mantenimiento (TP5-C) ---
# Montos globales usados por la liquidación mensual; cada débito se registra
# como una Transaccion de tipo DEBITO_COMISION.
app.comisiones.cuenta-corriente=5000.00
app.comisiones.caja-ahorro=2000.00

# Cron (6 campos Spring) que dispara la liquidación: primer día de cada mes a las 00:00.
# Para pruebas locales podés reemplazarlo por "0 * * * * *" (cada minuto).
app.comisiones.cron=0 0 0 1 * *