# ==============================================================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==============================================================================
spring.application.name=TP2

# ==============================================================================
# CONFIGURACIÓN DE LA CONEXIÓN A LA BASE DE DATOS (MYSQL)
# ==============================================================================
# URL de conexión JDBC apuntando al contenedor local y a la base de datos del sistema bancario.
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_bancario?useSSL=false&serverTimezone=America/Argentina/Jujuy&allowPublicKeyRetrieval=true

# Credenciales de acceso inyectadas mediante variables de entorno del sistema.
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC utilizado para la comunicación con MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURACIÓN DE HIBERNATE Y JPA
# ==============================================================================
# Estrategia DDL: 'update' valida y actualiza de forma automática las tablas según las entidades mapeadas.
spring.jpa.hibernate.ddl-auto=update

# Habilita la visualización de las sentencias SQL reales ejecutadas por Hibernate en la consola.
spring.jpa.show-sql=true

# Formatea el código SQL impreso en consola para mejorar su legibilidad.
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# CONFIGURACIÓN DE INICIALIZACIÓN DE DATOS (SCRIPT SQL)
# ==============================================================================
# Asegura que la ejecución del archivo data.sql ocurra siempre al iniciar la aplicación.
spring.sql.init.mode=always

# Aplica un retraso en la inicialización de los datos para garantizar que Hibernate
# haya creado las tablas correspondientes antes de ejecutar las sentencias INSERT.
spring.jpa.defer-datasource-initialization=true